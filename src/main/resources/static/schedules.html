<html lang="ko">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>일정 - Moi-Go</title><link rel="stylesheet" href="/css/style.css?v=20260721-service-ux" /></head>
  <body data-page="schedules" data-protected="true">
    <header class="app-header"><a class="brand" href="/index.html" aria-label="Moi-Go 홈"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/recruitments.html" data-protected-link="true">모집글</a><a href="/group.html" data-protected-link="true">그룹 홈</a></nav><div class="header-actions"><a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a><span id="authStatus" class="auth-chip">로그인 필요</span><a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a></div></header>
    <main class="page-shell"><div class="page-title"><p class="eyebrow">Schedules</p><h1>일정</h1><p>그룹 일정을 조회하고 생성, 상세 조회, 수정을 테스트합니다.</p></div><section class="split-layout"><article class="panel"><div class="panel-heading"><h2>일정 목록</h2><button id="loadSchedulesButton" class="button small" type="button">조회</button></div><div class="form-grid two"><label>그룹 ID<input id="scheduleGroupId" type="number" value="1" /></label><label>범위<select id="scheduleScope"><option value="upcoming">다가오는 일정</option><option value="past">지난 일정</option></select></label></div><div id="scheduleList" class="card-list"></div><hr class="panel-divider" /><h3>상세 조회</h3><div class="form-grid two"><label>그룹 ID<input id="scheduleDetailGroupId" type="number" value="1" /></label><label>일정 ID<input id="scheduleDetailId" type="number" value="1" /></label></div><button id="loadScheduleDetailButton" class="button full" type="button">상세 조회</button><pre id="scheduleOutput" class="output"></pre></article><article class="panel"><h2>일정 생성/수정</h2><form id="createScheduleForm" class="form-stack compact"><label>그룹 ID<input name="groupId" type="number" value="1" /></label><label>제목<input name="title" value="주간 스터디" /></label><label>일시<input name="scheduledAt" type="datetime-local" /></label><label>장소<input name="location" value="온라인" /></label><label>온라인 링크<input name="onlineLink" /></label><label>내용<textarea name="content">이번 주 학습 내용을 공유합니다.</textarea></label><label>준비물<textarea name="materials">노트북</textarea></label><label>응답 마감<input name="responseDeadline" type="datetime-local" /></label><button class="button" type="submit">일정 생성</button></form><hr class="panel-divider" /><form id="updateScheduleForm" class="form-stack compact"><label>그룹 ID<input name="groupId" type="number" value="1" /></label><label>일정 ID<input name="scheduleId" type="number" value="1" /></label><label>제목<input name="title" value="수정된 주간 스터디" /></label><label>일시<input name="scheduledAt" type="datetime-local" /></label><label>장소<input name="location" value="온라인" /></label><label>온라인 링크<input name="onlineLink" /></label><label>내용<textarea name="content">수정된 일정 내용입니다.</textarea></label><label>준비물<textarea name="materials">노트북, 발표 자료</textarea></label><button class="button secondary" type="submit">일정 수정</button></form></article></section></main>
    <script src="/js/api.js?v=20260721-service-ux"></script><script src="/js/auth.js?v=20260721-service-ux"></script><script src="/js/app.js?v=20260721-service-ux"></script>
  </body>
</html>
