<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 정보 - Moi-Go</title>
    <link rel="stylesheet" href="/css/style.css?v=20260721-profile-upload" />
  </head>
  <body data-page="mypage" data-protected="true">
    <header class="app-header">
      <a class="brand" href="/index.html" aria-label="Moi-Go 홈"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /></a>
      <nav class="main-nav" aria-label="주요 메뉴"><a href="/recruitments.html" data-protected-link="true">모집글</a><a href="/group.html" data-protected-link="true">그룹 홈</a></nav>
      <div class="header-actions"><a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a><span id="authStatus" class="auth-chip">로그인 필요</span><a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a></div>
    </header>
    <main class="page-shell">
      <div class="page-title">
        <p class="eyebrow">My profile</p>
        <h1>내 정보</h1>
        <p>프로필과 참여 중인 그룹을 확인합니다.</p>
      </div>

      <section class="profile-layout mypage-layout">
        <article class="panel profile-card">
          <div class="profile-header">
            <div class="profile-avatar" id="profileInitial">M</div>
            <div>
              <p class="eyebrow">Profile</p>
              <h2 id="profileNickname">불러오는 중</h2>
              <p id="profileEmail" class="muted">회원 정보를 조회하고 있습니다.</p>
            </div>
          </div>
          <div id="profileDetails" class="profile-details"></div>
          <button id="openEditMemberButton" class="button" type="button">프로필 수정</button>
        </article>

        <article class="panel my-groups-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">My groups</p>
              <h2>내 그룹</h2>
            </div>
          </div>
          <div id="myGroupList" class="card-list selectable-list"></div>
          <form id="addMyGroupForm" class="inline-add-form">
            <label>그룹 ID로 추가<input name="groupId" type="number" min="1" placeholder="예: 1" /></label>
            <button class="button secondary" type="submit">추가</button>
          </form>
          <p class="helper-text">그룹 홈에서 조회한 그룹도 여기에 자동으로 저장됩니다.</p>
        </article>

        <div id="memberEditBackdrop" class="modal-backdrop hidden"></div>
        <article id="memberEditPanel" class="panel edit-panel modal-panel hidden" role="dialog" aria-modal="true" aria-labelledby="memberEditTitle">
          <div class="panel-heading">
            <div><p class="eyebrow">Edit</p><h2 id="memberEditTitle">프로필 수정</h2></div>
            <button id="closeEditMemberButton" class="button ghost small" type="button">닫기</button>
          </div>
          <form id="updateMemberForm" class="form-stack compact">
            <label>닉네임<input name="nickname" /></label>
            <label>자기소개<textarea name="bio"></textarea></label>
            <label>관심사<input name="interests" /></label>
                        <div class="profile-image-editor">
              <input name="profileImageUrl" id="profileImageUrlInput" type="hidden" />
              <label>프로필 사진<input id="profileImageFileInput" type="file" accept="image/*" /></label>
              <div class="profile-image-preview"><div id="profileImagePreview" class="profile-avatar preview-avatar">M</div></div>
            </div>
            <button class="button" type="submit">저장하기</button>
          </form>
        </article>
      </section>
    </main>
    <script src="/js/api.js?v=20260721-profile-upload"></script>
    <script src="/js/auth.js?v=20260721-profile-upload"></script>
    <script src="/js/app.js?v=20260721-profile-upload"></script>
  </body>
</html>
