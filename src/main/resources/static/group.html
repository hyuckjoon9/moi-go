<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그룹 홈 - Moi-Go</title>
    <link rel="stylesheet" href="/css/style.css?v=20260721-service-ux" />
  </head>
  <body data-page="group" data-protected="true">
    <header class="app-header">
      <a class="brand" href="/index.html" aria-label="Moi-Go 홈"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /></a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="/recruitments.html" data-protected-link="true">모집글</a>
        <a href="/group.html" data-protected-link="true">그룹 홈</a>
        
        
      </nav>
      <div class="header-actions">
        <a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a>
        <span id="authStatus" class="auth-chip">로그인 필요</span>
        <a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a>
      </div>
    </header>

    <main class="page-shell group-workspace">
      <section class="group-hero panel">
        <div>
          <p class="eyebrow">Group Workspace</p>
          <h1 id="groupTitle">그룹 홈</h1>
          <p id="groupDescription">그룹을 조회하면 일정과 출석 관리 도구가 함께 열립니다.</p>
        </div>
        <div class="group-search">
          <label>그룹 ID<input id="groupIdInput" type="number" value="1" min="1" /></label>
          <button id="loadGroupButton" class="button" type="button">그룹 열기</button>
        </div>
      </section>

      <section id="groupSummary" class="metric-row"></section>

      <section class="group-layout">
        <article class="panel group-members-panel">
          <div class="panel-heading"><div><p class="eyebrow">Members</p><h2>활성 그룹원</h2></div></div>
          <div id="groupMemberList" class="card-list empty-state"><p>그룹을 먼저 조회하세요.</p></div>
        </article>

        <article class="panel group-schedule-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">Schedules</p><h2>일정 관리</h2></div>
            <button id="groupLoadSchedulesButton" class="button small" type="button">일정 조회</button>
          </div>
          <div class="form-grid two">
            <label>범위<select id="groupScheduleScope"><option value="upcoming">다가오는 일정</option><option value="past">지난 일정</option></select></label>
            <label>일정 ID<input id="groupScheduleId" type="number" value="1" min="1" /></label>
          </div>
          <div id="groupScheduleList" class="card-list"></div>
          <hr class="panel-divider" />
          <h3>새 일정 만들기</h3>
          <form id="groupCreateScheduleForm" class="form-grid two">
            <label>제목<input name="title" value="주간 스터디" required /></label>
            <label>일시<input name="scheduledAt" type="datetime-local" required /></label>
            <label>장소<input name="location" value="온라인" /></label>
            <label>온라인 링크<input name="onlineLink" placeholder="Zoom, Discord 등" /></label>
            <label class="span-2">내용<textarea name="content">이번 주 학습 내용을 공유합니다.</textarea></label>
            <label class="span-2">준비물<textarea name="materials">노트북, 학습 자료</textarea></label>
            <label class="span-2">응답 마감<input name="responseDeadline" type="datetime-local" /></label>
            <button class="button span-2" type="submit">일정 생성</button>
          </form>
        </article>

        <article class="panel group-attendance-panel">
          <div class="panel-heading"><div><p class="eyebrow">Attendance</p><h2>출석 관리</h2></div></div>
          <form id="groupAnswerAttendanceForm" class="form-stack compact">
            <label>일정 ID<input name="scheduleId" type="number" value="1" min="1" /></label>
            <label>내 참석 응답<select name="response"><option value="ATTEND">참석</option><option value="ABSENT">불참</option><option value="UNDECIDED">미정</option></select></label>
            <button class="button" type="submit">응답 저장</button>
          </form>
          <hr class="panel-divider" />
          <form id="groupCheckAttendanceForm" class="form-stack compact">
            <label>일정 ID<input name="scheduleId" type="number" value="1" min="1" /></label>
            <label>회원 ID<input name="userId" type="number" value="1" min="1" /></label>
            <label>출석 상태<select name="status"><option value="PRESENT">출석</option><option value="LATE">지각</option><option value="ABSENT">결석</option><option value="EXCUSED">인정 결석</option></select></label>
            <button class="button secondary" type="submit">출석 체크</button>
          </form>
          <hr class="panel-divider" />
          <label>요약 조회 일정 ID<input id="groupSummaryScheduleId" type="number" value="1" min="1" /></label>
          <button id="groupLoadAttendanceSummaryButton" class="button full" type="button">출석 요약 조회</button>
          <pre id="groupAttendanceOutput" class="output compact-output"></pre>
        </article>
      </section>
    </main>

    <script src="/js/api.js?v=20260721-service-ux"></script>
    <script src="/js/auth.js?v=20260721-service-ux"></script>
    <script src="/js/app.js?v=20260721-service-ux"></script>
  </body>
</html>
