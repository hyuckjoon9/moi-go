<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그룹 홈 - Moi-Go</title>
    <link rel="stylesheet" href="/css/style.css?v=20260721-nav-left" />
  </head>
  <body data-page="group" data-protected="true">
    <header class="app-header">
      <a class="brand" href="/index.html" aria-label="Moi-Go 홈"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /></a>
      <nav class="main-nav" aria-label="주요 메뉴"><a href="/group.html" data-protected-link="true">내 그룹</a><a href="/recruitments.html" data-protected-link="true">모집글</a></nav>
      <div class="header-actions"><a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a><span id="authStatus" class="auth-chip">로그인 필요</span><a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a></div>
    </header>

    <main class="page-shell group-page">
      <div class="page-title action-title">
        <div>
          <p class="eyebrow">Group Workspace</p>
          <h1 id="groupTitle">그룹 홈</h1>
          <p id="groupDescription">참여 중인 그룹을 선택하고 일정과 출석을 관리합니다.</p>
        </div>
        <div class="page-actions">
          <button id="openCreateGroupButton" class="button" type="button">그룹 생성</button>
        </div>
      </div>

      <section class="panel group-selector-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">My groups</p><h2>그룹 선택</h2></div>
          <button id="refreshMyGroupsButton" class="button ghost small" type="button">새로고침</button>
        </div>
        <div class="group-select-row">
          <label>내 그룹<select id="myGroupSelect"><option value="">그룹을 선택하세요</option></select></label>
          <button id="loadGroupButton" class="button" type="button">선택한 그룹 열기</button>
        </div>
        <div id="myGroupQuickList" class="card-list selectable-list group-quick-list"></div>
      </section>

      <section id="groupSummary" class="metric-row"></section>

      <section class="group-layout">
        <article class="panel group-members-panel">
          <div class="panel-heading"><div><p class="eyebrow">Members</p><h2>활성 그룹원</h2></div></div>
          <div id="groupMemberList" class="card-list empty-state"><p>그룹을 먼저 선택하세요.</p></div>
        </article>

        <article class="panel group-schedule-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">Schedules</p><h2>일정 관리</h2></div>
            <button id="groupLoadSchedulesButton" class="button small" type="button">일정 조회</button>
          </div>
          <div class="form-grid two">
            <label>범위<select id="groupScheduleScope"><option value="upcoming">다가오는 일정</option><option value="past">지난 일정</option></select></label>
            <label>일정 ID<input id="groupScheduleId" type="number" value="1" min="1" /></label>
          </div>
          <div id="groupScheduleList" class="card-list"></div>
          <hr class="panel-divider" />
          <h3>새 일정 만들기</h3>
          <form id="groupCreateScheduleForm" class="form-grid two">
            <label>제목<input name="title" placeholder="예: 주간 스터디" required /></label>
            <label>일시<input name="scheduledAt" type="datetime-local" required /></label>
            <label>장소<input name="location" placeholder="예: 온라인" /></label>
            <label>온라인 링크<input name="onlineLink" placeholder="Zoom, Discord 등" /></label>
            <label class="span-2">내용<textarea name="content" placeholder="이번 일정에서 다룰 내용을 적어주세요."></textarea></label>
            <label class="span-2">준비물<textarea name="materials" placeholder="필요한 준비물을 적어주세요."></textarea></label>
            <label class="span-2">응답 마감<input name="responseDeadline" type="datetime-local" /></label>
            <button class="button span-2" type="submit">일정 생성</button>
          </form>
        </article>

        <article class="panel group-attendance-panel">
          <div class="panel-heading"><div><p class="eyebrow">Attendance</p><h2>출석 관리</h2></div></div>
          <form id="groupAnswerAttendanceForm" class="form-stack compact">
            <label>일정 ID<input name="scheduleId" type="number" value="1" min="1" /></label>
            <label>내 참석 응답<select name="response"><option value="ATTEND">참석</option><option value="ABSENT">불참</option><option value="UNDECIDED">미정</option></select></label>
            <button class="button" type="submit">응답 저장</button>
          </form>
          <hr class="panel-divider" />
          <form id="groupCheckAttendanceForm" class="form-stack compact">
            <label>일정 ID<input name="scheduleId" type="number" value="1" min="1" /></label>
            <label>회원 ID<input name="userId" type="number" value="1" min="1" /></label>
            <label>출석 상태<select name="status"><option value="PRESENT">출석</option><option value="LATE">지각</option><option value="ABSENT">결석</option><option value="EXCUSED">인정 결석</option></select></label>
            <button class="button secondary" type="submit">출석 체크</button>
          </form>
          <hr class="panel-divider" />
          <label>요약 조회 일정 ID<input id="groupSummaryScheduleId" type="number" value="1" min="1" /></label>
          <button id="groupLoadAttendanceSummaryButton" class="button full" type="button">출석 요약 조회</button>
          <pre id="groupAttendanceOutput" class="output compact-output"></pre>
        </article>
      </section>

      <div id="groupCreateBackdrop" class="modal-backdrop hidden"></div>
      <article id="groupCreatePanel" class="panel edit-panel modal-panel group-create-panel hidden" role="dialog" aria-modal="true" aria-labelledby="groupCreateTitle">
        <div class="panel-heading">
          <div><p class="eyebrow">New Group</p><h2 id="groupCreateTitle">그룹 생성</h2></div>
          <button id="closeCreateGroupButton" class="button ghost small" type="button">닫기</button>
        </div>
        <form id="createGroupForm" class="form-stack compact">
          <label>그룹 이름<input name="name" placeholder="예: 프론트엔드 스터디" required /></label>
          <label>연결할 모집글 ID<input name="postId" type="number" min="1" placeholder="승인 완료된 모집글 ID" /></label>
          <button class="button" type="submit">그룹 생성</button>
        </form>
      </article>
    </main>

    <script src="/js/api.js?v=20260721-nav-left"></script>
    <script src="/js/auth.js?v=20260721-nav-left"></script>
    <script src="/js/app.js?v=20260721-nav-left"></script>
  </body>
</html>
