<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>출석 - Moi-Go</title><link rel="stylesheet" href="/css/style.css?v=20260721-nav-left" /></head>
  <body data-page="attendance" data-protected="true">
    <header class="app-header"><a class="brand" href="/index.html" aria-label="Moi-Go 홈"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/group.html" data-protected-link="true">내 그룹</a><a href="/recruitments.html" data-protected-link="true">모집글</a></nav><div class="header-actions"><a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a><span id="authStatus" class="auth-chip">로그인 필요</span><a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a></div></header>
    <main class="page-shell"><div class="page-title"><p class="eyebrow">Attendance</p><h1>출석</h1><p>출석 응답, 출석 체크, 수정, 삭제, 요약과 개인 출석률을 확인합니다.</p></div><section class="tri-layout"><article class="panel"><h2>참석 응답</h2><form id="answerAttendanceForm" class="form-stack compact"><label>일정 ID<input name="scheduleId" type="number" value="1" /></label><label>응답<select name="response"><option value="ATTEND">참석</option><option value="ABSENT">불참</option><option value="UNDECIDED">미정</option></select></label><button class="button" type="submit">응답 등록</button></form><button id="updateAnswerButton" class="button ghost full" type="button">응답 수정</button><button id="deleteAnswerButton" class="button ghost full" type="button">응답 삭제</button></article><article class="panel"><h2>출석 체크</h2><form id="checkAttendanceForm" class="form-stack compact"><label>일정 ID<input name="scheduleId" type="number" value="1" /></label><label>회원 ID<input name="userId" type="number" value="1" /></label><label>상태<select name="status"><option value="PRESENT">출석</option><option value="LATE">지각</option><option value="ABSENT">결석</option><option value="EXCUSED">인정 결석</option></select></label><button class="button" type="submit">체크 등록</button></form><button id="updateRecordButton" class="button ghost full" type="button">체크 수정</button><button id="deleteRecordButton" class="button ghost full" type="button">체크 삭제</button></article><article class="panel"><h2>조회</h2><label>요약 일정 ID<input id="summaryScheduleId" type="number" value="1" /></label><button id="loadAttendanceSummaryButton" class="button full" type="button">요약 조회</button><hr class="panel-divider" /><label>회원 ID<input id="attendanceRateUserId" type="number" value="1" /></label><button id="loadAttendanceRateButton" class="button secondary full" type="button">개인 출석률 조회</button></article></section><pre id="attendanceOutput" class="output"></pre></main>
    <script src="/js/api.js?v=20260721-nav-left"></script><script src="/js/auth.js?v=20260721-nav-left"></script><script src="/js/app.js?v=20260721-nav-left"></script>
  </body>
</html>
