<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모집글 - Moi-Go</title>
    <link rel="stylesheet" href="/css/style.css?v=20260723-api-actions" />
  </head>
  <body data-page="recruitments" data-protected="true">
    <header class="app-header">
      <a class="brand text-brand" href="/index.html" aria-label="Moi-Go 홈"><span class="brand-word">Moi-Go</span></a>
      <nav class="main-nav" aria-label="주요 메뉴"><a href="/group.html" data-protected-link="true">내 그룹</a><a href="/recruitments.html" data-protected-link="true">모집글</a></nav>
      <div class="header-actions"><a class="header-profile" href="/mypage.html" data-protected-link="true">내 정보</a><span id="authStatus" class="auth-chip">로그인 필요</span><a id="headerAuthLink" class="button ghost" href="/login.html">로그인</a></div>
    </header>

    <main class="page-shell recruitment-page">
      <div class="page-title action-title">
        <div>
          <p class="eyebrow">Recruitments</p>
          <h1 id="recruitmentPageTitle">모집글</h1>
          <p id="recruitmentPageDescription">스터디 모집글을 확인하고 참여할 그룹을 찾아보세요.</p>
        </div>
        <div class="page-actions">
          <a id="backToRecruitmentList" class="button ghost hidden" href="/recruitments.html">목록으로</a>
          <button id="openCreateRecruitmentButton" class="button" type="button">모집글 작성</button>
        </div>
      </div>

      <section id="recruitmentListSection" class="recruitment-list-section">
        <article class="panel list-panel full-list-panel">
          <div class="panel-heading recruitment-toolbar">
            <div><h2>모집글 목록</h2></div>
            <div class="recruitment-controls">
              <div class="segmented-control" aria-label="모집 상태 필터">
                <button class="active" type="button" data-recruitment-status="ALL">전체</button>
                <button type="button" data-recruitment-status="OPEN">모집 중</button>
                <button type="button" data-recruitment-status="CLOSED">모집 종료</button>
              </div>
              <div class="board-search" role="search">
                <select id="recruitmentSearchType" aria-label="검색 기준">
                  <option value="category">카테고리</option>
                  <option value="title">제목</option>
                  <option value="content">내용</option>
                  <option value="writer">글쓴이</option>
                </select>
                <input id="recruitmentSearchKeyword" placeholder="검색어를 입력하세요" />
                <button id="recruitmentSearchButton" class="button ghost small" type="button">검색</button>
              </div>
            </div>
          </div>
          <div id="recruitmentList" class="recruitment-table-list selectable-list"></div>
          <nav id="recruitmentPagination" class="pagination" aria-label="모집글 페이지"></nav>
        </article>
      </section>

      <section id="recruitmentDetailSection" class="recruitment-detail-section hidden">
        <article id="recruitmentDetailPanel" class="panel detail-panel recruitment-detail-panel board-detail-panel">
          <div id="recruitmentDetailView" class="detail-view"></div>
        </article>
      </section>

      <div id="recruitmentCreateBackdrop" class="modal-backdrop hidden"></div>
      <article id="recruitmentCreatePanel" class="panel edit-panel modal-panel recruitment-create-panel hidden" role="dialog" aria-modal="true" aria-labelledby="recruitmentCreateTitle">
        <div class="panel-heading">
          <div><p class="eyebrow">New Study</p><h2 id="recruitmentCreateTitle">모집글 작성</h2></div>
          <button id="closeCreateRecruitmentButton" class="button ghost small" type="button">닫기</button>
        </div>
        <form id="createRecruitmentForm" class="form-grid two">
          <label class="span-2"><span class="field-label">스터디 이름 <em class="field-tag required">필수</em></span><input name="title" placeholder="예: 프론트엔드 스터디 모집" required maxlength="100" /></label>
          <label><span class="field-label">카테고리 <em class="field-tag required">필수</em></span><input name="category" placeholder="예: 개발, 어학, 취업" required maxlength="50" /></label>
          <label><span class="field-label">모임 방식 <em class="field-tag required">필수</em></span><select name="meetingType" required><option value="ONLINE">온라인</option><option value="OFFLINE">오프라인</option><option value="HYBRID">온오프라인 병행</option></select></label>
          <label><span class="field-label">활동 지역 <em class="field-tag optional">선택</em></span><input name="location" placeholder="예: 서울 강남" /></label>
          <label><span class="field-label">온라인 링크 <em class="field-tag optional">선택</em></span><input name="onlineLink" placeholder="예: https://meet.google.com/..." /></label>
          <label><span class="field-label">정기 모임 요일 <em class="field-tag optional">선택</em></span><input name="meetingDay" placeholder="예: 매주 화요일" maxlength="50" /></label>
          <label><span class="field-label">모집 인원 <em class="field-tag required">필수</em></span><input name="capacity" type="number" min="1" placeholder="예: 4" required /></label>
          <label><span class="field-label">모집 마감일 <em class="field-tag required">필수</em></span><input name="recruitmentDeadline" type="date" required /></label>
          <label class="span-2"><span class="field-label">예상 활동 기간 <em class="field-tag optional">선택</em></span><input name="expectedDuration" placeholder="예: 8주, 3개월" maxlength="50" /></label>
          <label class="span-2"><span class="field-label">소개 <em class="field-tag optional">선택</em></span><textarea name="description" placeholder="스터디에서 다룰 내용과 분위기를 적어주세요."></textarea></label>
          <label class="span-2"><span class="field-label">목표 <em class="field-tag optional">선택</em></span><textarea name="goal" placeholder="스터디를 통해 달성하려는 목표를 적어주세요."></textarea></label>
          <label class="span-2"><span class="field-label">진행 방식 <em class="field-tag optional">선택</em></span><textarea name="method" placeholder="모임 주기, 과제, 발표 방식 등을 적어주세요."></textarea></label>
          <label class="span-2"><span class="field-label">참가 조건 <em class="field-tag optional">선택</em></span><textarea name="conditions" placeholder="필요한 경험이나 준비물을 적어주세요."></textarea></label>
          <button class="button span-2" type="submit">등록하기</button>
        </form>
      </article>

      <div id="needLeaderGroupBackdrop" class="modal-backdrop hidden"></div>
      <article id="needLeaderGroupPanel" class="panel edit-panel modal-panel notice-panel hidden" role="dialog" aria-modal="true" aria-labelledby="needLeaderGroupTitle">
        <div class="panel-heading">
          <div><p class="eyebrow">Group required</p><h2 id="needLeaderGroupTitle">먼저 그룹이 필요합니다</h2></div>
          <button id="closeNeedLeaderGroupButton" class="button ghost small" type="button">닫기</button>
        </div>
        <div class="notice-content">
          <p>모집글은 운영 중인 그룹을 홍보하는 글입니다. 모집글을 작성하려면 먼저 본인이 운영자인 그룹을 생성해야 합니다.</p>
          <div class="detail-actions notice-actions">
            <button id="goCreateGroupButton" class="button" type="button">그룹 생성하러 가기</button>
            <button id="cancelNeedLeaderGroupButton" class="button ghost" type="button">나중에 하기</button>
          </div>
        </div>
      </article>    </main>

    <script src="/js/api.js?v=20260723-api-actions"></script>
    <script src="/js/auth.js?v=20260723-api-actions"></script>
    <script src="/js/app.js?v=20260723-api-actions"></script>
  </body>
</html>
