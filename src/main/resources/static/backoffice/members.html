<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 관리 · Moi-Go Back Office</title>
    <link rel="stylesheet" href="/css/style.css?v=20260723-backoffice-members" />
  </head>
  <body data-page="backoffice-members">
    <header class="app-header backoffice-header">
      <a class="brand" href="/backoffice/index.html" aria-label="Moi-Go Back Office"><img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" /><span class="ops-label">Back Office</span></a>
      <nav class="main-nav" aria-label="백오피스 메뉴"><a href="/backoffice/index.html">운영 현황</a><a href="/backoffice/members.html" aria-current="page">회원 관리</a><a href="/index.html">사용자 서비스</a></nav>
      <div class="header-actions"><span id="boAdminName" class="auth-chip">운영자 확인 중</span></div>
    </header>
    <main class="page-shell">
      <div class="page-title"><p class="eyebrow">Back Office</p><h1>회원 관리</h1><p>회원 정보를 조회하고 이용 상태를 관리합니다.</p></div>
      <section id="boState" class="ops-notice" hidden></section>
      <section id="boMembers" class="split-layout">
        <article class="panel list-panel">
          <div class="panel-heading"><h2>회원 목록</h2><span id="memberCount" class="badge">0명</span></div>
          <form id="memberFilters" class="form-grid two">
            <label class="span-2">이메일 또는 닉네임<input name="keyword" type="search" placeholder="검색어 입력" /></label>
            <label>역할<select name="role"><option value="">전체 역할</option><option value="USER">일반 회원</option><option value="ADMIN">관리자</option></select></label>
            <label>상태<select name="status"><option value="">전체 상태</option><option value="ACTIVE">활성</option><option value="SUSPENDED">정지</option><option value="WITHDRAWN">탈퇴</option></select></label>
            <button class="button span-2" type="submit">검색</button>
          </form>
          <div id="memberList" class="card-list selectable-list"></div>
          <nav id="memberPagination" class="pagination" aria-label="회원 페이지"></nav>
        </article>
        <article class="panel detail-panel">
          <div class="panel-heading"><h2>회원 상세</h2><span id="memberStatus" class="badge" hidden></span></div>
          <div id="memberDetail" class="detail-view"><p class="empty-state">목록에서 회원을 선택하세요.</p></div>
          <form id="memberStatusForm" class="form-stack compact" hidden>
            <input name="memberId" type="hidden" />
            <input name="expectedStatus" type="hidden" />
            <label>변경 상태<select name="status"><option value="SUSPENDED">정지</option><option value="ACTIVE">활성</option></select></label>
            <label>조치 사유<textarea name="reason" minlength="5" maxlength="500" required placeholder="5자 이상 입력"></textarea></label>
            <button class="button secondary" type="submit">상태 변경</button>
          </form>
        </article>
      </section>
    </main>
    <script src="/js/api.js?v=20260723-backoffice"></script><script src="/js/auth.js?v=20260723-backoffice"></script><script src="/js/backoffice-members.js?v=20260723-backoffice-members"></script>
  </body>
</html>
