<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moi-Go Back Office</title>
    <link rel="stylesheet" href="/css/style.css?v=20260723-backoffice" />
  </head>
  <body data-page="backoffice">
    <header class="app-header backoffice-header">
      <a class="brand" href="/backoffice/index.html" aria-label="Moi-Go Back Office">
        <img class="brand-logo" src="/assets/moi-go-logo.jpg" alt="Moi-Go" />
        <span class="ops-label">Back Office</span>
      </a>
      <nav class="main-nav" aria-label="백오피스 메뉴">
        <a href="/backoffice/index.html">운영 현황</a>
        <a href="/backoffice/members.html">회원 관리</a>
        <a href="/index.html">사용자 서비스</a>
      </nav>
      <div class="header-actions"><span id="boAdminName" class="auth-chip">운영자 확인 중</span></div>
    </header>
    <main class="page-shell">
      <div class="page-title">
        <p class="eyebrow">Back Office</p>
        <h1>운영 현황</h1>
        <p>회원, 모집글, 그룹 현황과 최근 운영 조치를 확인합니다.</p>
      </div>
      <section id="boState" class="ops-notice" hidden></section>
      <section id="boDashboard" class="dashboard-grid">
        <article class="metric-card"><strong data-metric="members.total">-</strong><span>전체 회원</span></article>
        <article class="metric-card"><strong data-metric="members.active">-</strong><span>활성 회원</span></article>
        <article class="metric-card"><strong data-metric="members.suspended">-</strong><span>정지 회원</span></article>
        <article class="metric-card"><strong data-metric="members.withdrawn">-</strong><span>탈퇴 회원</span></article>
        <article class="metric-card"><strong data-metric="recruitments.recruiting">-</strong><span>모집 중</span></article>
        <article class="metric-card"><strong data-metric="recruitments.active">-</strong><span>진행 중 모집글</span></article>
        <article class="metric-card"><strong data-metric="groups.active">-</strong><span>활성 그룹</span></article>
        <article class="metric-card"><strong data-metric="groups.ended">-</strong><span>종료 그룹</span></article>
        <article class="panel wide">
          <h2>최근 운영 조치</h2>
          <div id="boRecentActions" class="card-list"></div>
        </article>
      </section>
    </main>
    <script src="/js/api.js?v=20260723-backoffice"></script>
    <script src="/js/auth.js?v=20260723-backoffice"></script>
    <script src="/js/backoffice.js?v=20260723-backoffice"></script>
  </body>
</html>
