spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moigo_test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=test-secret-key-for-jwt-signature-32bytes+
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000
